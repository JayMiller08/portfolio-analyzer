<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redline Portfolio Grader</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-container">
        <header class="header">
            <div class="logo">
                <strong>Redline</strong> <span class="logo-sub">PORTFOLIO GRADER</span>
            </div>
            <nav class="nav">
                <a href="#" class="nav-link">GRADE</a>
                <a href="#" class="nav-link">WORKBOOK</a>
            </nav>
        </header>

        <main class="main-content">
            <div class="content-wrapper">
                <div class="audit-badge">PORTFOLIO AUDIT</div>
                <h1 class="main-title">Paste a URL. Read what<br>the recruiter actually saw.</h1>
                <p class="description">
                    We grade your site the way a hiring manager does — first<br>
                    impression, proof, clarity, craft. Vercel, Netlify, custom<br>
                    domains all accepted.
                </p>
                
                <form id="grade-form" class="url-form">
                    <div class="input-wrapper">
                        <span class="url-prefix">https://</span>
                        <input type="text" id="portfolio-url" placeholder="jordan-lee.vercel.app" required>
                        <button type="submit" class="submit-btn">Grade it</button>
                    </div>
                </form>
                
                <div id="results-container" class="results-container hidden">
                    <!-- Results will be injected here -->
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="footer-left">
                REDLINE &middot; GRADE YOUR PORTFOLIO
            </div>
            <div class="footer-right">
                <a href="#" id="regrade-btn">RE-GRADE &rarr;</a>
            </div>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
